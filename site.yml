# Lancer : ansible-playbook site.yml
- name: VM 2 — socle, Hermes et Hindsight
  hosts: vm2
  become: true
  roles:
    - base      # apt update/upgrade, durcissement SSH, pare-feu ufw
    - docker    # Docker CE + plugin compose depuis le dépôt officiel
    - crowdsec  # moteur sur l'hôte, bouncer nftables, scénario SSH strict
    - agents    # Hindsight (+ Postgres pgvector) et Hermes avec le plugin Hindsight

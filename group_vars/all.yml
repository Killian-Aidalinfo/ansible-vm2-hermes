admin_user: etudiant

# API locale CrowdSec sur le bridge docker0 : un futur Traefik (plugin bouncer) la joindra.
crowdsec_lapi_addr: 172.17.0.1
crowdsec_lapi_port: 8080
crowdsec_metrics_port: 6060
swap_size: 2G

# Hermes + Hindsight (stack Compose dans agents_dir, ports seulement sur 127.0.0.1).
agents_dir: /opt/agents
hermes_image: nousresearch/hermes-agent:v0.23.0
hindsight_image: ghcr.io/vectorize-io/hindsight:1.2.0
hindsight_db_image: pgvector/pgvector:0.8.7-pg18
hermes_home: "/home/{{ admin_user }}/.hermes"
hindsight_bank_id: hermes

# Fournisseur LLM commun à Hermes et à l'extraction de Hindsight.
# La clé se met dans credentials/llm_api_key (hors git) ; sans elle, Hindsight démarre sans LLM.
llm_provider: openrouter            # openrouter | anthropic | openai
hindsight_llm_model: openai/gpt-5-mini
llm_api_key: "{{ lookup('ansible.builtin.file', 'credentials/llm_api_key', errors='ignore') | default('', true) }}"
hermes_llm_env:
  openrouter: OPENROUTER_API_KEY
  anthropic: ANTHROPIC_API_KEY
  openai: OPENAI_API_KEY

# Générés au premier lancement et gardés dans ./credentials (hors git).
hindsight_db_password: "{{ lookup('ansible.builtin.password', 'credentials/hindsight_db_password length=32 chars=ascii_letters,digits') }}"
hindsight_api_key: "{{ lookup('ansible.builtin.password', 'credentials/hindsight_api_key length=40 chars=ascii_letters,digits') }}"
hindsight_cp_key: "{{ lookup('ansible.builtin.password', 'credentials/hindsight_cp_key length=24 chars=ascii_letters,digits') }}"
